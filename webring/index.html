<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tinyMyTerms Webring &mdash; IEEE 7012-2025 Members</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #4b6fed;
      --accent-hover: #6b8aff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    header a {
      color: var(--accent);
      text-decoration: none;
    }

    header a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .member-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .member-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
    }

    .member-card__header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .member-card__name {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .member-card__name a {
      color: var(--accent);
      text-decoration: none;
    }

    .member-card__name a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .member-card__joined {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .member-card__agreements {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .badge {
      display: inline-block;
      background: #1f2937;
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    }

    footer {
      margin-top: 3rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>tinyMyTerms Webring</h1>
      <p>Sites implementing <a href="https://myterms.info/">IEEE 7012-2025 MyTerms</a> via tinyMyTerms &mdash;
        machine-readable consent for humans and machines.</p>
    </header>

    <p class="section-title">Members</p>

    <ul class="member-list">
      <li class="member-card">
        <div class="member-card__header">
          <span class="member-card__name">
            <a href="https://ainative.studio" target="_blank" rel="noopener">AINative Studio</a>
          </span>
          <span class="member-card__joined">Joined 2026-04-27</span>
        </div>
        <div class="member-card__agreements">
          <span class="badge">SD-BASE</span>
          <span class="badge">SD-BASE-DP</span>
          <span class="badge">PDC-AI</span>
          <span class="badge">PDC-GOOD</span>
          <span class="badge">PDC-INTENT</span>
        </div>
      </li>
    </ul>

    <footer>
      <span>tinyMyTerms Webring &mdash; IEEE 7012-2025</span>
      <a href="https://github.com/dmarti/tinyMyTerms" target="_blank" rel="noopener">
        Join this webring &rarr;
      </a>
    </footer>
  </div>
</body>
</html>
